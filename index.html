<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">

        <header>
            <h1>💰 Smart Expense Tracker</h1>
            <p>Track your expenses and manage your money</p>
        </header>

        <section class="dashboard">

            <div class="card">
                <h3>Total Balance</h3>
                <p id="balance">₹0</p>
            </div>

            <div class="card">
                <h3>Total Income</h3>
                <p id="income">₹0</p>
            </div>

            <div class="card">
                <h3>Total Expense</h3>
                <p id="expense">₹0</p>
            </div>

        </section>

        <section class="expense-form">

            <h2>Add New Expense</h2>
            <form id="expenseform">
                <input type="text" id="title" placeholder="Expense title">

                <input type="number" id="amount" placeholder="Expense amount">

                <select name="" id="category">
                    <option value="">Select Category</option>
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                </select>

                <input type="date" id="date">

                <button type="submit" id="submitBtn">Add Expense</button>

            </form>
        </section>

        <section class="income-form">

            <h2>Add Income</h2>

            <form id="incomeform">

                <input
                    type="text"
                    id="incomeTitle"
                    placeholder="Income title"
                >

                <input
                    type="number"
                    id="incomeAmount"
                    placeholder="Income amount"
                >

                <input
                    type="date"
                    id="incomeDate"
                >

                <button type="submit">
                    Add Income
                </button>

            </form>

        </section>

        <section class="expense-history">

            <h2>Expense History</h2>

            <input
            type="text"
            id="expenseSearch"
            placeholder="Search expense..."
            >

            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
            </select>

            <div id="expenseList"></div>

        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
